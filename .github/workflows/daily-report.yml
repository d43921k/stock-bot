name: Daily Stock Report

on:
  schedule:
    # 每天 08:30 台灣時間（UTC+8）執行，開盤（09:00）前產生晨報；此時抓到的台股/美股
    # 資料即為前一交易日收盤（美股為隔夜收盤）。cron 以 UTC 表示：00:30 UTC = 08:30 台灣時間。
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-stock-report
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate morning report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m stock_bot.main

      - name: Commit and push updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update daily stock report ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
